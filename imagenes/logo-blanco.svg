<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 92" width="480" height="92">
  <defs>
    <linearGradient id="cyberGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Isotipo: Hexágono tecnológico más grande y definido -->
  <g transform="translate(6, 6)" filter="url(#subtleGlow)">
    <!-- Hexágono exterior -->
    <polygon points="40,3 76,23 76,61 40,81 4,61 4,23" 
             fill="#0b132b" stroke="url(#cyberGradWhite)" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Circuito 'C' de Cybertech -->
    <path d="M 58,26 L 32,26 A 16,16 0 0,0 16,42 A 16,16 0 0,0 32,58 L 58,58" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Puntos de circuito -->
    <circle cx="40" cy="42" r="4.5" fill="#38bdf8"/>
    <circle cx="58" cy="26" r="3.5" fill="#ffffff"/>
    <circle cx="58" cy="58" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Tipografía: CYBERTECH + TECNOLOGÍA & INNOVACIÓN más grande y clara -->
  <g transform="translate(98, 16)">
    <text x="0" y="34" font-family="'Segoe UI', 'Montserrat', -apple-system, sans-serif" 
          font-weight="900" font-size="38" letter-spacing="1.5" fill="#ffffff">
      CYBER<tspan fill="url(#cyanGrad)">TECH</tspan>
    </text>
    <text x="2" y="58" font-family="'Segoe UI', 'Montserrat', sans-serif" 
          font-weight="700" font-size="13.5" letter-spacing="3.2" fill="#38bdf8">
      TECNOLOGÍA &amp; INNOVACIÓN
    </text>
  </g>
</svg>
